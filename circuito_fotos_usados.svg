<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 396" width="760" height="396" role="img" aria-label="De la planilla al sitio web, sin intervencion manual" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="circuito-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#8a8f98"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="396" fill="#ffffff"/>

  <text x="24" y="34" font-size="15" font-weight="600" fill="#1a1a1a">De la planilla al sitio web, sin intervención manual</text>

  <g fill="none" stroke="#8a8f98" stroke-width="1.25">
    <path d="M236 140H274" marker-end="url(#circuito-arrow)"/>
    <path d="M486 140H524" marker-end="url(#circuito-arrow)"/>
    <path d="M630 176V284" marker-end="url(#circuito-arrow)"/>
    <path d="M524 320H236" marker-end="url(#circuito-arrow)"/>
    <path d="M130 284V176" marker-end="url(#circuito-arrow)"/>
  </g>

  <g>
    <rect x="24" y="104" width="212" height="72" rx="8" fill="none" stroke="#8a8f98" stroke-width="1.25"/>
    <text x="130" y="128" text-anchor="middle" font-weight="600" fill="#1a1a1a">Planilla de stock</text>
    <text x="40" y="144" font-size="11.5" fill="#6b7280">Dominio, marca y fecha de</text>
    <text x="40" y="160" font-size="11.5" fill="#6b7280">reserva de cada unidad</text>
  </g>

  <g>
    <rect x="274" y="104" width="212" height="72" rx="8" fill="none" stroke="#8a8f98" stroke-width="1.25"/>
    <text x="380" y="128" text-anchor="middle" font-weight="600" fill="#1a1a1a">Revisión automática</text>
    <text x="290" y="144" font-size="11.5" fill="#6b7280">Detecta qué autos publicar</text>
    <text x="290" y="160" font-size="11.5" fill="#6b7280">y cuáles dar de baja</text>
  </g>

  <g>
    <rect x="524" y="104" width="212" height="72" rx="8" fill="none" stroke="#8a8f98" stroke-width="1.25"/>
    <text x="630" y="128" text-anchor="middle" font-weight="600" fill="#1a1a1a">SharePoint</text>
    <text x="540" y="144" font-size="11.5" fill="#6b7280">Toma solo las fotos de la</text>
    <text x="540" y="160" font-size="11.5" fill="#6b7280">carpeta preparada para web</text>
  </g>

  <g>
    <rect x="524" y="284" width="212" height="72" rx="8" fill="#2f6fed" fill-opacity="0.12" stroke="#2f6fed" stroke-width="2"/>
    <text x="630" y="308" text-anchor="middle" font-weight="600" fill="#1a1a1a">Sitio web</text>
    <text x="540" y="324" font-size="11.5" fill="#6b7280">Publica o retira las fotos</text>
    <text x="540" y="340" font-size="11.5" fill="#6b7280">con nombre uniforme</text>
  </g>

  <g>
    <rect x="24" y="284" width="212" height="72" rx="8" fill="none" stroke="#8a8f98" stroke-width="1.25"/>
    <text x="130" y="308" text-anchor="middle" font-weight="600" fill="#1a1a1a">Registro en la planilla</text>
    <text x="40" y="324" font-size="11.5" fill="#6b7280">Queda asentado qué se</text>
    <text x="40" y="340" font-size="11.5" fill="#6b7280">publicó de cada unidad</text>
  </g>

  <text x="620" y="230" text-anchor="end" font-size="11.5" fill="#6b7280">fotos descargadas</text>
  <text x="380" y="312" text-anchor="middle" font-size="11.5" fill="#6b7280">devuelve el listado publicado</text>
  <text x="142" y="230" font-size="11.5" fill="#6b7280">ya publicado: no se repite</text>
</svg>
